name: coucou
options:
  bundleIdPrefix: com.marswave
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: CJSWWQ2B9V
    CODE_SIGN_STYLE: Automatic
targets:
  coucou:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
    entitlements:
      path: bikecues.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: ai.marswave.coucou
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 咕咕骑车
        LSRequiresIPhoneOS: true
        UIUserInterfaceStyle: Dark
        UIDeviceFamily:
          - 1
          - 2
        UILaunchScreen:
          UIColorName: LaunchBackground
        NSHealthShareUsageDescription: 咕咕骑车读取苹果健康中的骑行训练（手表写入的也算），用于展示骑行数据与导出。只读，不写入。
  coucouTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: coucou
schemes:
  coucou:
    build:
      targets:
        coucou: all
    test:
      config: Debug
      targets:
        - coucouTests
